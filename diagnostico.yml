name: 9. Diagnostico de la API

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          SMARTFLEX_DOC: ${{ secrets.SMARTFLEX_DOC }}
          SMARTFLEX_EMAIL: ${{ secrets.SMARTFLEX_EMAIL }}
          SMARTFLEX_DEVICE_ID: ${{ secrets.SMARTFLEX_DEVICE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reservar_smartflex.py --modo diagnostico
