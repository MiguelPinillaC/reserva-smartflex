name: 1. Preguntar si quiero clase

on:
  schedule:
    # 8:00 p.m. hora Bogota = 01:00 UTC del dia siguiente.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  preguntar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          SMARTFLEX_DOC: ${{ secrets.SMARTFLEX_DOC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reservar_smartflex.py --modo preguntar
