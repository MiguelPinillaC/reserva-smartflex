name: 2. Recordar a las 9:20 pm

on:
  schedule:
    # 21:20 hora Bogota = 02:20 UTC del dia siguiente. Respaldo:
    # el reloj real vive en cron-job.org (ver RELOJ-EXTERNO.md).
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recordar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          SMARTFLEX_DOC: ${{ secrets.SMARTFLEX_DOC }}
          SMARTFLEX_EMAIL: ${{ secrets.SMARTFLEX_EMAIL }}
          SMARTFLEX_DEVICE_ID: ${{ secrets.SMARTFLEX_DEVICE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reservar_smartflex.py --modo recordar
      - name: Guardar estado
        if: always()
        run: |
          if [[ -n "$(git status --porcelain estado.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: recordatorio"
            git pull --rebase --autostash
            git push
          fi
